<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerraTwin — Researcher Clearance</title>
  <meta name="description" content="Register as a planetary analog researcher on the TerraTwin scientific exploration platform.">
  
  <!-- Typography (Orbitron, IBM Plex Sans Arabic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/luxe.css">
  <link rel="stylesheet" href="css/fonts.css">
</head>
<body class="auth-viewport">
  <!-- Visually hidden skip link for keyboard accessibility -->
  <a href="#main-content" class="skip-link" data-i18n="nav.skip_link">Skip to main content</a>

  <!-- Ultra-Realistic Deep Space Orbit & Starfield Canvas -->
  <canvas id="authCanvasBg"></canvas>

  <!-- Ambient Radiant Nebula Glow Spheres -->
  <div class="auth-ambient-glow top-left"></div>
  <div class="auth-ambient-glow bottom-right"></div>

  <!-- Top Navigation & Controls Bar -->
  <header class="auth-top-bar">
    <a href="index.html" class="auth-back-btn" title="Back to TerraTwin Platform">
      <svg class="auth-back-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span data-i18n="auth.back_home">Back to Observatory</span>
    </a>

    <div class="auth-top-actions">
    </div>
  </header>

  <!-- Floating Glassmorphic Authentication Card (Wide for Registration) -->
  <main class="auth-card-container mode-register" id="authCardContainer">
    <span id="main-content" tabindex="-1"></span>
    <div class="auth-card">
      
      <!-- Holographic Laser Wipe Beam -->
      <div class="auth-card-scanline" id="authCardScanline"></div>

      <!-- Card Header -->
      <div class="auth-header">
        <div class="auth-brand-mark mode-register" id="authBrandMark">
          <!-- Sign In Planetary Orbit Icon -->
          <svg class="brand-icon-signin" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#d9b77e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <circle cx="12" cy="12" r="9"></circle>
            <ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(-30 12 12)"></ellipse>
            <circle cx="12" cy="12" r="2.5" fill="#a0b2cc"></circle>
          </svg>
          <!-- Register Star Clearance Badge Icon -->
          <svg class="brand-icon-register" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#86c4a0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            <circle cx="12" cy="12" r="3" fill="#dea062"></circle>
          </svg>
        </div>
        <h1 class="auth-title" id="authHeaderTitle" data-i18n="auth.register_title">Researcher Account Clearance</h1>
        <p class="auth-subtitle" id="authHeaderSub" data-i18n="auth.register_sub">Join the Astraea scientific network to catalog and match planetary analogs</p>
      </div>

      <!-- Animated Sliding Navigation Tabs -->
      <div class="auth-nav-tabs" id="authNavTabs">
        <div class="auth-tab-slider" id="authTabSlider"></div>
        <button type="button" class="auth-nav-tab" id="tabBtnSignIn" data-i18n="auth.tab_signin">Sign In</button>
        <button type="button" class="auth-nav-tab active" id="tabBtnRegister" data-i18n="auth.tab_register">Create Account</button>
      </div>

      <!-- Dynamic Alert Box -->
      <div class="auth-alert-box" id="authAlertBox"></div>

      <!-- Sliding Forms Container -->
      <div class="auth-forms-slider">
        
        <!-- ==================== SIGN IN VIEW ==================== -->
        <form class="auth-form-view hidden-left" id="signInFormView">
          
          <div class="auth-field-group">
            <label class="auth-label" for="loginEmail" data-i18n="auth.email_label">Official Research Email or ID:</label>
            <div class="auth-input-wrapper">
              <input type="email" class="auth-input" id="loginEmail" placeholder="researcher@terratwin.space" required autocomplete="email">
            </div>
          </div>

          <div class="auth-field-group">
            <label class="auth-label" for="loginPassword" data-i18n="auth.password_label">Clearance Password:</label>
            <div class="auth-input-wrapper">
              <input type="password" class="auth-input" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="auth-password-toggle" title="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="auth-options-row">
            <label class="auth-checkbox-label">
              <input type="checkbox" id="rememberMeCheckbox" checked>
              <span data-i18n="auth.remember_me">Remember My Session</span>
            </label>
            <a href="#" class="auth-link-text" id="forgotPassLink" data-i18n="auth.forgot_password">Forgot Password?</a>
          </div>

          <button type="submit" class="auth-submit-btn" id="signInSubmitBtn">
            <span data-i18n="auth.btn_signin">Access Mission Platform</span>
          </button>

          <button type="button" class="auth-demo-btn" id="quickDemoLoginBtn">
            <span data-i18n="auth.btn_demo">1-Click Fast Researcher Demo</span>
          </button>

          <div class="auth-card-footer">
            <span data-i18n="auth.no_account">Don't have an account yet?</span>
            <a href="#" class="auth-link-text" id="linkToRegister" style="margin-inline-start: 0.4rem;" data-i18n="auth.goto_register">Create New Researcher Account</a>
          </div>

        </form>

        <!-- ==================== REGISTER VIEW ==================== -->
        <form class="auth-form-view active" id="registerFormView">
          
          <div class="auth-field-group">
            <label class="auth-label" for="regName" data-i18n="auth.name_label">Full Researcher Name:</label>
            <div class="auth-input-wrapper">
              <input type="text" class="auth-input" id="regName" placeholder="Dr. Sarah Connor" required autocomplete="name">
            </div>
          </div>

          <div class="auth-field-group">
            <label class="auth-label" for="regEmail" data-i18n="auth.email_label">Official Research Email or ID:</label>
            <div class="auth-input-wrapper">
              <input type="email" class="auth-input" id="regEmail" placeholder="s.connor@agency.space" required autocomplete="email">
            </div>
          </div>

          <div class="auth-field-group">
            <label class="auth-label" for="regPassword" data-i18n="auth.password_reg_label">Clearance Password (5+ characters):</label>
            <div class="auth-input-wrapper">
              <input type="password" class="auth-input" id="regPassword" placeholder="••••••••" required autocomplete="new-password">
              <button type="button" class="auth-password-toggle" title="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="auth-field-group">
            <label class="auth-label" data-i18n="auth.avatar_label">Researcher Identity &amp; Avatar:</label>
            <div class="auth-avatar-grid">
              <label class="auth-avatar-card">
                <input type="radio" name="userAvatarRadio" value="astronaut_m" data-gender="male" checked>
                <div class="auth-avatar-box">
                  <div class="auth-avatar-svg" data-avatar-id="astronaut_m" data-avatar-size="52"></div>
                  <span class="auth-avatar-label" data-i18n="auth.avatar_male">Male Astronaut</span>
                </div>
              </label>
              <label class="auth-avatar-card">
                <input type="radio" name="userAvatarRadio" value="astronaut_f" data-gender="female">
                <div class="auth-avatar-box">
                  <div class="auth-avatar-svg" data-avatar-id="astronaut_f" data-avatar-size="52"></div>
                  <span class="auth-avatar-label" data-i18n="auth.avatar_female">Female Astronaut</span>
                </div>
              </label>
              <label class="auth-avatar-card">
                <input type="radio" name="userAvatarRadio" value="scientist_m" data-gender="male">
                <div class="auth-avatar-box">
                  <div class="auth-avatar-svg" data-avatar-id="scientist_m" data-avatar-size="52"></div>
                  <span class="auth-avatar-label" data-i18n="auth.avatar_scientist_m">Male Scientist</span>
                </div>
              </label>
              <label class="auth-avatar-card">
                <input type="radio" name="userAvatarRadio" value="scientist_f" data-gender="female">
                <div class="auth-avatar-box">
                  <div class="auth-avatar-svg" data-avatar-id="scientist_f" data-avatar-size="52"></div>
                  <span class="auth-avatar-label" data-i18n="auth.avatar_scientist_f">Female Scientist</span>
                </div>
              </label>
              <label class="auth-avatar-card">
                <input type="radio" name="userAvatarRadio" value="commander" data-gender="neutral">
                <div class="auth-avatar-box">
                  <div class="auth-avatar-svg" data-avatar-id="commander" data-avatar-size="52"></div>
                  <span class="auth-avatar-label" data-i18n="auth.avatar_commander">Mission Commander</span>
                </div>
              </label>
              <label class="auth-avatar-card">
                <input type="radio" name="userAvatarRadio" value="geologist" data-gender="neutral">
                <div class="auth-avatar-box">
                  <div class="auth-avatar-svg" data-avatar-id="geologist" data-avatar-size="52"></div>
                  <span class="auth-avatar-label" data-i18n="auth.avatar_geologist">Planetary Geologist</span>
                </div>
              </label>
            </div>
          </div>

          <div class="auth-field-group">
            <label class="auth-label" for="regRole" data-i18n="auth.role_label">Planetary Specialization:</label>
            <div class="auth-input-wrapper">
              <select class="auth-input" id="regRole" style="cursor:pointer;">
                <option value="Planetary Geospatial Engineering" data-i18n="auth.role_geospatial">Planetary Geospatial Engineering</option>
                <option value="Field Rover Autonomous Navigation" data-i18n="auth.role_rover">Field Rover Autonomous Navigation</option>
                <option value="Astrobiology & Extremophile Analogs" data-i18n="auth.role_astrobiology">Astrobiology &amp; Extremophile Analogs</option>
                <option value="In-Situ Resource Utilization (ISRU)" data-i18n="auth.role_isru">In-Situ Resource Utilization (ISRU)</option>
                <option value="Comparative Field Analog Geology" data-i18n="auth.role_geology">Comparative Field Analog Geology</option>
              </select>
            </div>
          </div>

          <div class="auth-options-row">
            <label class="auth-checkbox-label">
              <input type="checkbox" id="agreeEthicsCheckbox" required checked>
              <span data-i18n="auth.ethics_agree">I agree to the Planetary Protection &amp; Scientific Ethics Charter</span>
            </label>
          </div>

          <button type="submit" class="auth-submit-btn" id="registerSubmitBtn">
            <span data-i18n="auth.btn_register">Grant Clearance &amp; Begin Exploration</span>
          </button>

          <div class="auth-card-footer">
            <span data-i18n="auth.has_account">Already registered?</span>
            <a href="#" class="auth-link-text" id="linkToLogin" style="margin-inline-start: 0.4rem;" data-i18n="auth.goto_signin">Sign In to Your Account</a>
          </div>

        </form>

        <!-- ==================== FORGOT / RESET PASSWORD VIEW ==================== -->
        <form class="auth-form-view hidden-right" id="forgotFormView">
          <div class="auth-field-group">
            <label class="auth-label" for="forgotEmailInput" data-i18n="auth.forgot_email_label">Registered Email Address:</label>
            <div class="auth-input-wrapper">
              <input type="email" class="auth-input" id="forgotEmailInput" placeholder="researcher@astraea.space" required autocomplete="email">
            </div>
          </div>

          <div class="forgot-code-banner" id="forgotCodeBanner" style="display:none;"></div>

          <div id="forgotResetFields" style="display:none; flex-direction:column; gap:1rem;">
            <div class="auth-field-group">
              <label class="auth-label" for="forgotResetCode" data-i18n="auth.reset_code_label">Verification Code Sent to Email (6 digits):</label>
              <div class="auth-input-wrapper">
                <input type="text" class="auth-input" id="forgotResetCode" placeholder="123456" maxlength="6" inputmode="numeric">
              </div>
            </div>

            <div class="auth-field-group">
              <label class="auth-label" for="forgotNewPassword" data-i18n="auth.new_password_label">New Password (5+ characters):</label>
              <div class="auth-input-wrapper">
                <input type="password" class="auth-input" id="forgotNewPassword" placeholder="••••••••" autocomplete="new-password">
                <button type="button" class="auth-password-toggle" title="Toggle password visibility"></button>
              </div>
            </div>

            <div class="auth-field-group">
              <label class="auth-label" for="forgotConfirmPassword" data-i18n="auth.confirm_password_label">Confirm New Password:</label>
              <div class="auth-input-wrapper">
                <input type="password" class="auth-input" id="forgotConfirmPassword" placeholder="••••••••" autocomplete="new-password">
                <button type="button" class="auth-password-toggle" title="Toggle password visibility"></button>
              </div>
            </div>
          </div>

          <button type="submit" class="auth-submit-btn" id="forgotSubmitBtn">
            <span id="forgotSubmitBtnText" data-i18n="auth.btn_send_code">Send Verification Code to Email</span>
          </button>

          <button type="button" class="auth-demo-btn" id="resendForgotCodeBtn" style="display:none;">
            <span data-i18n="auth.btn_resend_code">Resend New Code</span>
          </button>

          <div class="auth-card-footer">
            <a href="#" class="auth-link-text" id="backToSignInFromForgot" data-i18n="auth.back_to_signin">Back to Sign In</a>
          </div>
        </form>

      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="data/data-store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/user-system.js"></script>
  <script src="js/auth-bg.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/luxe.js" defer></script>
</body>
</html>
