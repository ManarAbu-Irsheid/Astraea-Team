[build]
  # Rebuilds every page's data from the Excel file on each deploy.
  # To update the site: replace data/final_data.xlsx and push.
  command = "pip install openpyxl && python tools/build-site-data.py data/final_data.xlsx"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
